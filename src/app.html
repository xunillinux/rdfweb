<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<title>Robot Dog Funeral</title>
		
		<!-- Primary Meta Tags -->
		<meta name="description" content="Robot Dog Funeral - An indie rock/post-punk band with electrifying music. Check out our latest album 'Dead Inside'!">
		<meta name="keywords" content="Robot Dog Funeral, indie rock, post-punk, new album, music streaming, live shows">
		<meta name="author" content="Robot Dog Funeral">
		<meta name="robots" content="index, follow">
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Open Graph / Facebook / WhatsApp -->
		<meta property="og:title" content="Robot Dog Funeral">
		<meta property="og:description" content="Listen to our latest album 'Dead Inside' now! Available on all streaming platforms.">
		<meta property="og:image" content="https://robotdogfuneral.com/preview-image.jpg">
		<meta property="og:url" content="https://robotdogfuneral.com">
		<meta property="og:type" content="website">

		<!-- Favicon -->
		<link rel="icon" href="%sveltekit.assets%/favicon.png" sizes="32x32" type="image/png">
		<link rel="apple-touch-icon" href="%sveltekit.assets%/favicon.png">
		<meta name="theme-color" content="#000000">

		<!-- Canonical URL -->
		<link rel="canonical" href="https://robotdogfuneral.com">

		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "MusicGroup",
				"name": "Robot Dog Funeral",
				"url": "https://robotdogfuneral.com",
				"logo": "https://robotdogfuneral.com/images/logo.png",
				"sameAs": [
					"https://www.facebook.com/robotdogfuneralband",
					"https://www.instagram.com/robotdogfuneralband",
					"https://open.spotify.com/artist/0VWexRbUH4PpcsbMjUJxJi"
				]
			}
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
